# =============================================================================
# AI Ecosystem V2.0 - Mapowanie Modeli Ollama do Ról AI
# =============================================================================
models:
  # ---------------------------------------------------------------------------
  # Kodeks / SQL / XML / SVG - Qwen Code Excellence
  # ---------------------------------------------------------------------------
  code_analysis:
    provider: "ollama"
    name: ${CODE_MODEL}
    role:
      - "code_review"
      - "sql_generation"
      - "xml_parsing"
      - "svg_manipulation"
    
  # ---------------------------------------------------------------------------
  # Logika / Reasoning - DeepSeek R1 (Chain of Thought)
  # Fallbacki: qwen3.5, phi-4
  # ---------------------------------------------------------------------------
  reasoning:
    provider: "ollama"
    name: ${REASONING_MODEL}
    role:
      - "reasoning"
      - "planning"
      - "debugging"
    fallbacks:
      - qwen3.5:7b-instruct
      - phi-4
    
  # ---------------------------------------------------------------------------
  # Tekst / Obsidian / Polski - Llama 3.1 Excellent PL Support
  # ---------------------------------------------------------------------------
  text:
    provider: "ollama"
    name: ${TEXT_MODEL}
    role:
      - "summarization"
      - "nlp_tasks"
      - "pl_translation"
      - "obsidian_vault_reading"
    
  # ---------------------------------------------------------------------------
  # Vision / Grafiki / SVG - Qwen VL (Vision Language)
  # ---------------------------------------------------------------------------
  vision:
    provider: "ollama"
    name: ${VISION_MODEL}
    role:
      - "image_analysis"
      - "svg_parsing"
      - "chart_reading"
    
  # ---------------------------------------------------------------------------
  # Embeddings dla RAG (Retrieval Augmented Generation)
  # ---------------------------------------------------------------------------
  embedding:
    provider: "ollama"
    name: ${EMBEDDING_MODEL}
    dimension: 1024
    roles:
      - "dense_retrieval"
      - "semantic_search"

# =============================================================================
# Default model do użytku ogólnego
# =============================================================================
default_model: ${TEXT_MODEL}

# =============================================================================
# Limity i ustawienia Ollama
# =============================================================================
ollama_settings:
  timeout: ${OLLAMA_TIMEOUT}
  keep_alive: ${OLLAMA_KEEP_ALIVE}
  num_ctx: ${OLLAMA_NUM_CTX}