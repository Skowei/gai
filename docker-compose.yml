services:
  # =============================================================================
  # OLLAMA DLA NVIDIA: Uruchamia się automatycznie, gdy COMPOSE_PROFILES=nvidia
  # =============================================================================
  ollama-nvidia:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - nvidia
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              count: all
    restart: unless-stopped

  # =============================================================================
  # OLLAMA DLA AMD: Uruchamia się automatycznie, gdy COMPOSE_PROFILES=amd
  # =============================================================================
  ollama-amd:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - amd
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_VULKAN=1
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/kfd:/dev/kfd"
    restart: unless-stopped

  # =============================================================================
  # BASE 1: PostgreSQL 16 z pgvector (Zunifikowana baza danych)
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
      - ./data/pg_init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # BASE 2: Redis 7 Alpine (Pamięć podręczna L1 & Szyna zdarzeń)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: ai_memory_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # ASYNC API CORE (FASTAPI): Nowe asynchroniczne serce systemu operacyjnego AI
  # =============================================================================
  api-core:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: ai_api_core
    ports:
      - "8080:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - .:/app
      - ${OBSIDIAN_HOST_PATH}:/app/obsidian_vault
      - ./data/local_notes:/app/local_notes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
