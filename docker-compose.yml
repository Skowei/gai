version: "3.8"

services:
  # =============================================================================
  # OLLAMA: Lokalny silnik modeli LLM
  # =============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              count: all
  # =============================================================================
  # BASE 1: PostgreSQL 16 z pgvector (Baza danych & RAG)
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
      - ./data/pg_init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # BASE 2: Redis 7 Alpine (Semantic Cache)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: ai_memory_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # MEMORY CORE: TencentDB Agent Memory
  # =============================================================================
  memory-core:
    image: agentmemory/memory-core:latest
    container_name: memory-core
    environment:
      - NODE_ENV=production
      - STATE_BACKEND=${STATE_BACKEND}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=tdai_memory
      - BM25_LANGUAGE=en
      # --- Mapowanie bazy PostgreSQL ---
      - MEMORY_DRIVER=postgres
      - DB_DIALECT=${DB_DIALECT}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE=${POSTGRES_DB}
      # --------------------------------------
      - TDAI_LLM_BASE_URL=${TDAI_LLM_BASE_URL}
      - TDAI_LLM_API_KEY=${TDAI_LLM_API_KEY}
      - TDAI_LLM_MODEL=${TDAI_LLM_MODEL}
      - TDAI_MEMORY_EMBEDDING_PROVIDER=ollama
      - TDAI_MEMORY_EMBEDDING_BASE_URL=${OLLAMA_BASE_URL}
      - TDAI_MEMORY_EMBEDDING_API_KEY=${TDAI_LLM_API_KEY}
      - TDAI_MEMORY_EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - TDAI_MEMORY_EMBEDDING_DIMENSIONS=1024
    ports:
      - "8420:8420"
    volumes:
      - ./data/tdai_memory:/data/tdai-memory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # =============================================================================
  # FLASK FRONTEND: Flask AI Chat Client (Interfejs webowy & API)
  # =============================================================================
  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: ai_memory_flask_frontend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - API_URL=http://memory-core:8420
      - API_KEY=test-team
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - CODE_MODEL=${CODE_MODEL}
      - REASONING_MODEL=${REASONING_MODEL}
      - TEXT_MODEL=${TEXT_MODEL}
      - VISION_MODEL=${VISION_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX}
    volumes:
      - .:/app
      - ${OBSIDIAN_HOST_PATH}:/app/obsidian_vault:ro
      - ./data/local_notes:/app/local_notes:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
      - memory-core
      - ollama
    restart: unless-stopped

volumes:
  data:
